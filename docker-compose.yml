# Local development database.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (add -v to also delete all data)
services:
  postgres:
    image: postgres:17-alpine
    container_name: instalite-postgres
    environment:
      POSTGRES_DB: instalite
      POSTGRES_USER: instalite
      POSTGRES_PASSWORD: instalite
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instalite -d instalite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
